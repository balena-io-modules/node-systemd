[package]
name = "balena-systemd"
version = "0.5.11"
description = "Essential systemd D-Bus bindings for Node.js "
repository = "https://github.com/balena-io-modules/systemd/"
authors = ["Balena Inc. <hello@balena.io>"]
license = "Apache-2.0"
edition = "2021"
exclude = ["index.node"]

[lib]
crate-type = ["cdylib"]

[dependencies]
once_cell = "1.21.4"
futures-util = "0.3"

[dependencies.zbus]
version = "5.15.0"
default-features = false
features = ["tokio"]

[dependencies.tokio]
version = "1.52.1"
features = ["rt-multi-thread"]

[dependencies.neon]
version = "1.1"
default-features = false
features = ["napi-6"]

[profile.release]
opt-level = "z"
codegen-units = 1
